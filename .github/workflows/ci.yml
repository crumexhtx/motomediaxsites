name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Lint, test, validate, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Typecheck scripts
        run: pnpm exec tsc -p tsconfig.scripts.json --noEmit

      - name: Validate catalog
        run: REQUIRE_LOCAL_IMAGES=1 pnpm validate:catalog

      - name: Check discontinued.json is synced
        run: |
          cp src/data/discontinued.json /tmp/discontinued.before.json
          pnpm sync:discontinued
          if ! cmp -s src/data/discontinued.json /tmp/discontinued.before.json; then
            echo "discontinued.json drifted from model-years.json — run pnpm sync:discontinued (or pnpm maintain:discontinued) and commit"
            diff -u /tmp/discontinued.before.json src/data/discontinued.json || true
            exit 1
          fi

      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.motomediax.com

      - name: Verify every sitemap URL (SEO gate)
        # Starts the production server, crawls all sitemap.xml URLs (status,
        # one H1, canonical/og:url, JSON-LD, meta description, forbidden copy,
        # img alt), then stops the server. Fails the job on any regression.
        run: |
          PORT=3100 pnpm start > /tmp/next-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3100/; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "Server did not become ready"; cat /tmp/next-start.log; exit 1
          fi
          node scripts/verify-sitemap-pages.mjs http://127.0.0.1:3100 --concurrency=8
        env:
          NEXT_PUBLIC_SITE_URL: https://www.motomediax.com
